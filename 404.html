  </div>
<main>
    <!-- ════════════════════════════════════════════

<!-- Lightbox Modal -->
<div class="lightbox" id="lightbox">
  <span class="close-btn" id="lb-close">×</span>
  <img src="" alt="Full‑size view" id="lb-img"/>
</div>

<script>
/* -------- UI Toggle (hamburger, theme) -------- */
const hamburgerBtn   = document.getElementById('hamburger-btn');
const dropdownMenu   = document.getElementById('dropdown-menu');
const themeToggleIn = document.getElementById('theme-toggle-input');

hamburgerBtn.addEventListener('click', () => {
  hamburgerBtn.classList.toggle('active');
  dropdownMenu.classList.toggle('show');
});

document.querySelectorAll('.dropdown-menu a').forEach(link => {
  link.addEventListener('click', () => {
    hamburgerBtn.classList.remove('active');
    dropdownMenu.classList.remove('show');
  });
});

themeToggleIn.addEventListener('change', function() {
  if (this.checked) {
    document.body.setAttribute('data-theme', 'dark');
    localStorage.setItem('theme', 'dark');
  } else {
    document.body.removeAttribute('data-theme');
    localStorage.setItem('theme', 'light');
  }
});

window.addEventListener('load', () => {
  const saved = localStorage.getItem('theme');
  if (saved === 'dark') {
    themeToggleIn.checked = true;
    document.body.setAttribute('data-theme', 'dark');
  }
});

</script>
</body>
</html>
